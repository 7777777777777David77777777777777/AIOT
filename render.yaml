# Free web + free Postgres (database expires after 30 days).
databases:
  - name: photo-exam-db
    plan: free
    region: singapore
    ipAllowList: []

services:
  - type: web
    name: photo-exam-solver
    runtime: docker
    plan: free
    region: singapore
    branch: main
    healthCheckPath: /health.php
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: photo-exam-db
          property: connectionString
      - key: DATA_DIR
        value: /var/data
      - key: SECRET_KEY
        generateValue: true
      - key: COOKIE_SECURE
        value: "1"
      - key: ENCRYPT_STORED_KEYS
        value: "0"
