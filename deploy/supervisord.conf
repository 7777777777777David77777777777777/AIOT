[supervisord]
nodaemon=true
user=root
logfile=/dev/null
pidfile=/tmp/photo-supervisord.pid

[program:python-api]
command=/usr/local/bin/uvicorn asgi:app --host 127.0.0.1 --port 5001 --proxy-headers --forwarded-allow-ips 127.0.0.1
directory=/app
autorestart=true
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=10

[program:php-web]
command=/usr/sbin/apache2ctl -D FOREGROUND
autorestart=true
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=20

[program:task-worker]
command=/usr/local/bin/python /app/worker.py
directory=/app
autorestart=true
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=15
