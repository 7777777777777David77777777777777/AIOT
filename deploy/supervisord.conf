[supervisord]
nodaemon=true
user=root
logfile=/dev/null
pidfile=/tmp/photo-supervisord.pid

[program:python-api]
command=/usr/local/bin/gunicorn --bind 127.0.0.1:5001 --workers 1 --threads 8 --timeout 120 --access-logfile - wsgi:app
directory=/app
autorestart=true
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=10

[program:php-web]
command=/usr/sbin/apache2ctl -D FOREGROUND
autorestart=true
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=20
