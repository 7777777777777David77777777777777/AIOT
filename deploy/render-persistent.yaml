# Paid persistent option. Review Render's displayed cost before creating.
services:
  - type: web
    name: photo-exam-solver
    runtime: docker
    plan: 0.5c-512mb
    healthCheckPath: /health.php
    disk:
      name: photo-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: DATABASE_URL
        value: sqlite:////var/data/exam_solver.db
      - key: DATA_DIR
        value: /var/data
      - key: SECRET_KEY
        generateValue: true
      - key: COOKIE_SECURE
        value: "1"
      - key: ENCRYPT_STORED_KEYS
        value: "0"
